# /etc/netplan/00-installer-config.yaml (ws1)
# Note: route "via" points to ws1's own address; kept verbatim from the lab.
network:
  renderer: networkd
  ethernets:
    enp0s3:
      dhcp4: no
      addresses:
        - 10.0.2.50/24
      gateway4: 10.0.2.2
      nameservers:
        addresses: [1.1.1.1, 8.8.8.8]
    enp0s8:
      dhcp4: no
      addresses:
        - 192.168.100.10/16
      routes:
        - to: 172.16.0.0/12
          via: 192.168.100.10
  version: 2
