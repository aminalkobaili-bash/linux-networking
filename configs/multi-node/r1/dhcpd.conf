# /etc/dhcp/dhcpd.conf (r1) — active part; stock commented examples omitted
# No "range" in the subnet: only the host reserved by MAC gets an address.

subnet 10.10.0.0 netmask 255.255.192.0 {
    option routers 10.10.0.1;
    option domain-name-servers 8.8.8.8;
}

host ws11 {
    hardware ethernet 10:10:10:10:10:BA;
    fixed-address 10.10.0.50;
}
