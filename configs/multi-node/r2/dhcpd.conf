# /etc/dhcp/dhcpd.conf (r2) — active part; stock commented examples omitted
# Empty declaration for the 10.100.0.0/16 link so dhcpd does not complain about it.
# Note: domain-name-servers points to r2, but no DNS server runs on r2 (kept verbatim).

subnet 10.100.0.0 netmask 255.255.0.0 {
}

subnet 10.20.0.0 netmask 255.255.255.192 {
    range 10.20.0.2 10.20.0.50;
    option routers 10.20.0.1;
    option domain-name-servers 10.20.0.1;
}
